<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dallin H. Oaks</title>
    <style>
        #card {
            height: 75%;
            justify-items: center;
            grid-column: 2 / 3;
            background: #008DB4;
            border: 7px solid #004E63;
            border-radius: 40px;
            margin: 50px;
            padding-top: 0px;
            padding-left: 40px;
            padding-right: 40px;
            padding-bottom: 50px;

        }
        #img-oaks {
            border: 5px solid #FEFEFE;
            font-family: 'Hel';
            height: 300px;
            margin-bottom: 0;
        }
        #quote {
            font-family: 'Brush Script MT', sans-serif;
            font-size: 22px;
            color: #FFD783;
            margin-bottom: 50px;
        }
        body {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            background: #FFECD7;
            font-weight: 15px;
        }
        h1 {
            font-family: Helvetica, sans-serif;
            font-size: 2.5em;
            color: #FEFEFE;
            text-align: center;
        }
        a {
            text-decoration: none;
        }
        a p {
            font-family: Helvetica, sans-serif;
            font-weight: 0.5em;
            color: #91E4FB;
            text-align: center;
        }
        ul {
            margin-top: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 22px;
            color: #FEFEFE;
        }
    </style>
</head>
<body>
    <div id="card">
        <h1>Dallin H. Oaks</h1>
        <a href="churchofjesuschrist.org"><p>18th President of the Church of Jesus Christ of Latter-Day Saints</p></a>

        <section id="prophet-box">
            <img id="img-oaks" src="images/oaks.webp" alt="President Oaks">
            <ul>
                <li>Born: Aug 12, 1932</li>
                <li>Apostle: Apr 7, 1984</li>
                <li>Prophet: Oct 14, 2025</li>
            </ul>

        </section>

        <p id="quote">"The only solution to the differences that divide us is for all of us to follow our Savior's teachings and to gradually become even as He is."</p>
    </div>
</body>
</html>
